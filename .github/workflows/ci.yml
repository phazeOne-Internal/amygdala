name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.x"]
        exclude:
          # Apple Silicon runners have no Python 3.8 build; the oldest supported there is covered below.
          - os: macos-latest
            python: "3.8"
        include:
          - os: macos-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the script test suite
        run: python -m unittest discover -s tests -v

  analysers:
    name: Scripts with cppcheck, flawfinder and semgrep (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: python -m pip install --upgrade pip flawfinder semgrep
      - name: Run the script test suite with the analysers present
        env:
          FW_TEST_REQUIRE_TOOLS: cppcheck,flawfinder,semgrep
          SEMGREP_SEND_METRICS: "off"
        run: python -m unittest discover -s tests -v

  plugin:
    name: Validate plugin and marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate ./plugin
