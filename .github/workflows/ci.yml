name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the runs still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Scripts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.x"]
        exclude:
          # No Python 3.8 build for Apple Silicon runners or Ubuntu 26.04; those legs are covered below.
          - os: macos-latest
            python: "3.8"
          - os: ubuntu-latest
            python: "3.8"
        include:
          - os: macos-latest
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the script test suite
        run: python -m unittest discover -s tests -v

  analysers:
    name: Analysers installed the skill's way (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 rather than ubuntu-latest: semgrep's engine is killed on the 26.04 image.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cppcheck, flawfinder, semgrep and lizard using the commands run_static_tools.py --check prints
        run: python ci/install_tools.py static cppcheck flawfinder semgrep lizard
      - name: Run the script test suite with the analysers required to run
        env:
          FW_TEST_REQUIRE_TOOLS: cppcheck,flawfinder,semgrep,lizard
          SEMGREP_SEND_METRICS: "off"
        run: python -m unittest discover -s tests -v

  pipeline:
    name: CI entry point on the eCTF fixture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the analysers the way the skill tells users to
        run: python ci/install_tools.py static cppcheck flawfinder semgrep lizard
      - name: Check tools and configuration
        run: python ci/amygdala_ci.py check --root evals/review/ectf-2025-insecure-example --config ci/amygdala-ci.example.json
      - name: Run every step with no baseline (the fixture is defective on purpose, so the gates must fail)
        shell: bash
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          set +e
          python ci/amygdala_ci.py all --root evals/review/ectf-2025-insecure-example --out-dir "$RUNNER_TEMP/amygdala-ci" --baseline "$RUNNER_TEMP/baseline.json"
          code=$?
          set -e
          echo "exit code $code"
          test "$code" -eq 1
          test -f "$RUNNER_TEMP/amygdala-ci/leads.sarif"
          test -f "$RUNNER_TEMP/amygdala-ci/junit.xml"
          test ! -f "$RUNNER_TEMP/amygdala-ci/osv_leads.json"   # nothing was sent
      - name: Accept the current state as the baseline, then the gates must pass
        shell: bash
        run: |
          python ci/amygdala_ci.py baseline --root evals/review/ectf-2025-insecure-example --out-dir "$RUNNER_TEMP/amygdala-ci" --baseline "$RUNNER_TEMP/baseline.json"
          python ci/amygdala_ci.py report --root evals/review/ectf-2025-insecure-example --out-dir "$RUNNER_TEMP/amygdala-ci" --baseline "$RUNNER_TEMP/baseline.json"
      - name: Publish the gate results as test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amygdala-ci-${{ matrix.os }}
          path: ${{ runner.temp }}/amygdala-ci
          if-no-files-found: error

  scancode:
    name: ScanCode installed by install_scancode.py (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ScanCode Toolkit with the skill's installer
        run: python ci/install_tools.py scancode
      - name: Run the script test suite with a real ScanCode scan
        env:
          FW_TEST_REQUIRE_SCANCODE: "1"
        run: python -m unittest discover -s tests -v

  plugin:
    name: Validate plugin and marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate ./plugin
