schema_version: "1.1"
name: psoc6-subtle-defects
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Finds the subtle defects and does not raise false alarms on safe code. Red: uint16 total-length wraparound in
  protocol_handle_frame allowing an out-of-bounds read before the MAC check; CY_ASSERT(cyhal_trng_init(...)) removed in
  Release so the TRNG is never initialised; zero_cross_isr calling relay_apply which blocks on a mutex in ISR context.
  Also: off-by-one payload[len] write at len == MAX_PAYLOAD; uninitialised status buffer used for non-status commands;
  uncapped reconnect backoff overflow; non-atomic config save / static cfg never loaded so saves clobber fields; torn
  64-bit energy counter; replay window after reboot / non-constant-time HMAC compare. Safe patterns (terminated strncpy,
  strcpy of a literal, wrap-safe tick subtraction, supervisor watchdog, rare config writes) are not rated Red.
